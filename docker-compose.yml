services:
  db:
    image: postgres:17
    container_name: sherpa-db
    environment:
      POSTGRES_DB: ${SHERPA_DB_NAME:-sherpa}
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:${SHERPA_DB_PORT:-5433}:5432"
    volumes:
      - sherpa_pgdata:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ${SHERPA_DB_NAME:-sherpa}"]
      interval: 3s
      timeout: 3s
      retries: 20

  # FastAPI over the pipeline, reachable inside the compose network only (no host port).
  # Inside the network the DB is db:5432 (the host port 5433 is only for the host).
  api:
    build: .
    container_name: sherpa-api
    env_file: .env
    environment:
      SHERPA_DB_HOST: db
      SHERPA_DB_PORT: "5432"
    depends_on:
      db:
        condition: service_healthy

  # Next.js UI on 127.0.0.1:3000; it proxies /api/* to the api service.
  web:
    build:
      context: ./web
      args:
        SHERPA_API_URL: http://api:8000 # rewrites are resolved at build time, so the build needs it too
    container_name: sherpa-web
    environment:
      SHERPA_API_URL: http://api:8000
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - api

  # One-shot seed: docker compose run --rm seed   (SEED=7 SHERPA_DB_NAME=... to vary)
  seed:
    build: .
    profiles: [tools]
    env_file: .env
    environment:
      SHERPA_DB_HOST: db
      SHERPA_DB_PORT: "5432"
    command: ["sh", "-c", "python -m gen.generate --seed ${SEED:-42} --create && python -m db.roles"]
    volumes:
      - ./data:/app/data
    depends_on:
      db:
        condition: service_healthy

volumes:
  sherpa_pgdata: {}
